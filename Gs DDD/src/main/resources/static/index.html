<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HidroSafe SCS - Teste da API</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 24px auto; padding: 0 16px; color: #1f2937; background: #f3f4f6; }
        h1 { color: #0b5394; margin-bottom: 4px; }
        .card { background: #fff; border-radius: 8px; padding: 16px; margin-top: 16px; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
        label { display: block; font-size: 13px; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { padding: 8px 14px; border: 0; border-radius: 4px; cursor: pointer; background: #0b5394; color: #fff; margin-top: 12px; }
        button.cinza { background: #64748b; }
        button.editar { background: #0369a1; margin-top: 0; }
        button.excluir { background: #b91c1c; margin-top: 0; }
        #abas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
        #abas button { margin-top: 0; background: #e2e8f0; color: #1f2937; }
        #abas button.ativa { background: #0b5394; color: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
        .tabela { overflow-x: auto; }
        #status { padding: 10px; border-radius: 4px; margin-top: 16px; display: none; font-size: 14px; }
        .ok { background: #dcfce7; color: #166534; }
        .erro { background: #fee2e2; color: #991b1b; }
        .dica { font-size: 12px; color: #64748b; margin: 4px 0 0; }
    </style>
</head>
<body>

<h1>HidroSafe SCS</h1>
<p id="subtitulo">Página de teste da API</p>

<div id="abas"></div>

<div id="status"></div>

<div class="card">
    <h3 id="titulo-form"></h3>
    <p class="dica" id="dica"></p>
    <form id="form">
        <div id="campos"></div>
        <button type="submit" id="btn-salvar">Cadastrar</button>
        <button type="button" class="cinza" id="btn-cancelar" style="display:none">Cancelar edição</button>
    </form>
</div>

<div class="card">
    <h3 id="titulo-lista"></h3>
    <div class="tabela">
        <table>
            <thead>
            <tr id="cabecalho"></tr>
            </thead>
            <tbody id="corpo"></tbody>
        </table>
    </div>
</div>

<script>
    // cada entidade: rota, nome da chave, campos do formulário (tipo: texto, numero ou select) e colunas da tabela
    // select: busca as opções em 'ref' e mostra o campo 'texto', mas envia o campo 'valor' (o ID)
    const ENTIDADES = [
        {
            nome: "Regiões", singular: "região", rota: "/regioes", chave: "idRegiao",
            campos: [
                { k: "nmRegiao", rotulo: "Nome da região", ph: "Ex: Barcelona" },
                { k: "nmCidade", rotulo: "Cidade", ph: "Ex: São Caetano do Sul" },
                { k: "dsNivelRisco", rotulo: "Nível de risco (BAIXO, MEDIO ou ALTO)", ph: "Ex: ALTO" }
            ],
            colunas: [["ID", "idRegiao"], ["Região", "nmRegiao"], ["Cidade", "nmCidade"], ["Risco", "dsNivelRisco"]]
        },
        {
            nome: "Ruas", singular: "rua", rota: "/ruas", chave: "idRua",
            campos: [
                { k: "idRegiao", rotulo: "Região", tipo: "select", ref: "/regioes", valor: "idRegiao", texto: "nmRegiao" },
                { k: "nmRua", rotulo: "Nome da rua", ph: "Ex: Avenida Goiás" },
                { k: "nrLimiteCm", rotulo: "Limite de alagamento em cm (opcional, padrão 30)", tipo: "numero", ph: "Ex: 30" }
            ],
            colunas: [["ID", "idRua"], ["Região", "idRegiao"], ["Rua", "nmRua"], ["Limite (cm)", "nrLimiteCm"]]
        },
        {
            nome: "Sensores", singular: "sensor", rota: "/sensores", chave: "idSensor",
            campos: [
                { k: "idRua", rotulo: "Rua", tipo: "select", ref: "/ruas", valor: "idRua", texto: "nmRua" },
                { k: "nmSensor", rotulo: "Nome do sensor", ph: "Ex: Sensor Goiás 01" },
                { k: "dsStatus", rotulo: "Status (ATIVO ou INATIVO; opcional, padrão ATIVO)", ph: "Ex: ATIVO" }
            ],
            colunas: [["ID", "idSensor"], ["Rua", "idRua"], ["Sensor", "nmSensor"], ["Status", "dsStatus"]]
        },
        {
            nome: "Leituras", singular: "leitura", rota: "/leituras", chave: "idLeitura",
            dica: "SENSOR exige o ID do sensor (da mesma rua); RELATO não pode ter sensor. Se o nível chegar ao limite da rua, um alerta é criado automaticamente (veja a aba Alertas).",
            campos: [
                { k: "idRua", rotulo: "Rua", tipo: "select", ref: "/ruas", valor: "idRua", texto: "nmRua" },
                { k: "dsOrigem", rotulo: "Origem (SENSOR ou RELATO)", ph: "Ex: SENSOR" },
                { k: "idSensor", rotulo: "Sensor (só para origem SENSOR)", tipo: "select", ref: "/sensores", valor: "idSensor", texto: "nmSensor", opcional: true },
                { k: "nrNivelCm", rotulo: "Nível da água em cm", tipo: "numero", ph: "Ex: 34" },
                { k: "nmReportante", rotulo: "Reportante (opcional, para RELATO)", ph: "Ex: Maria" }
            ],
            colunas: [["ID", "idLeitura"], ["Rua", "idRua"], ["Sensor", "idSensor"], ["Origem", "dsOrigem"],
                ["Nível (cm)", "nrNivelCm"], ["Data", "dtLeitura"], ["Reportante", "nmReportante"]]
        },
        {
            nome: "Alertas", singular: "alerta", rota: "/alertas", chave: "idAlerta",
            dica: "Para encerrar um alerta, clique em Editar e troque o status para ENCERRADO.",
            campos: [
                { k: "idRua", rotulo: "Rua", tipo: "select", ref: "/ruas", valor: "idRua", texto: "nmRua" },
                { k: "dsGravidade", rotulo: "Gravidade (ATENCAO, ALERTA ou EMERGENCIA)", ph: "Ex: ALERTA" },
                { k: "dsMensagem", rotulo: "Mensagem", ph: "Ex: Água subindo rápido" },
                { k: "dsStatus", rotulo: "Status (ATIVO ou ENCERRADO; opcional, padrão ATIVO)", ph: "Ex: ATIVO" }
            ],
            colunas: [["ID", "idAlerta"], ["Rua", "idRua"], ["Gravidade", "dsGravidade"], ["Mensagem", "dsMensagem"],
                ["Status", "dsStatus"], ["Emissão", "dtEmissao"]]
        },
        {
            nome: "Abrigos", singular: "abrigo", rota: "/abrigos", chave: "idAbrigo",
            dica: "Se a ocupação for igual à capacidade, o status vira LOTADO automaticamente (a menos que esteja FECHADO).",
            campos: [
                { k: "idRegiao", rotulo: "Região", tipo: "select", ref: "/regioes", valor: "idRegiao", texto: "nmRegiao" },
                { k: "nmAbrigo", rotulo: "Nome do abrigo", ph: "Ex: Ginásio Municipal" },
                { k: "dsEndereco", rotulo: "Endereço", ph: "Ex: Rua das Flores, 100" },
                { k: "nrCapacidade", rotulo: "Capacidade", tipo: "numero", ph: "Ex: 100" },
                { k: "nrOcupacao", rotulo: "Ocupação (opcional, padrão 0)", tipo: "numero", ph: "Ex: 0" },
                { k: "nrKitsEstoque", rotulo: "Kits em estoque (opcional, padrão 0)", tipo: "numero", ph: "Ex: 50" },
                { k: "dsStatus", rotulo: "Status (ABERTO, LOTADO ou FECHADO; opcional, padrão ABERTO)", ph: "Ex: ABERTO" }
            ],
            colunas: [["ID", "idAbrigo"], ["Região", "idRegiao"], ["Abrigo", "nmAbrigo"], ["Endereço", "dsEndereco"],
                ["Capacidade", "nrCapacidade"], ["Ocupação", "nrOcupacao"], ["Kits", "nrKitsEstoque"], ["Status", "dsStatus"]]
        }
    ];

    // colunas de ID que viram nome na tabela (a chave da própria entidade continua mostrando o ID)
    const REFERENCIAS = {
        idRegiao: { rota: "/regioes", nome: "nmRegiao" },
        idRua: { rota: "/ruas", nome: "nmRua" },
        idSensor: { rota: "/sensores", nome: "nmSensor" }
    };

    let atual = ENTIDADES[0];
    let idEditando = null;

    function mostrar(texto, deuCerto) {
        const caixa = document.getElementById("status");
        caixa.textContent = texto;
        caixa.className = deuCerto ? "ok" : "erro";
        caixa.style.display = "block";
    }

    async function textoErro(resp) {
        try {
            const erro = await resp.json();
            return erro.mensagem || "Erro desconhecido";
        } catch (e) {
            return "Erro desconhecido";
        }
    }

    async function chamar(metodo, url, corpo) {
        try {
            const opcoes = { method: metodo, headers: { "Content-Type": "application/json" } };
            if (corpo) {
                opcoes.body = JSON.stringify(corpo);
            }
            return await fetch(url, opcoes);
        } catch (e) {
            mostrar("Não foi possível conectar à API. Ela está rodando?", false);
            return null;
        }
    }

    function montarAbas() {
        const abas = document.getElementById("abas");
        abas.innerHTML = "";
        ENTIDADES.forEach(function (ent) {
            const botao = document.createElement("button");
            botao.type = "button";
            botao.textContent = ent.nome;
            botao.className = ent === atual ? "ativa" : "";
            botao.onclick = function () { trocarAba(ent); };
            abas.appendChild(botao);
        });
    }

    function trocarAba(ent) {
        atual = ent;
        document.getElementById("status").style.display = "none";
        montarAbas();
        montarFormulario();
        limpar();
        document.getElementById("titulo-lista").textContent = ent.nome + " cadastradas";
        document.getElementById("subtitulo").textContent = "Página de teste da API: " + ent.nome;

        const cabecalho = document.getElementById("cabecalho");
        cabecalho.innerHTML = "";
        ent.colunas.concat([["Ações", null]]).forEach(function (col) {
            const th = document.createElement("th");
            th.textContent = col[0];
            cabecalho.appendChild(th);
        });
        document.getElementById("corpo").innerHTML = "";
        listar();
    }

    function montarFormulario() {
        const area = document.getElementById("campos");
        area.innerHTML = "";
        atual.campos.forEach(function (c) {
            const rotulo = document.createElement("label");
            rotulo.appendChild(document.createTextNode(c.rotulo));
            let campo;
            if (c.tipo === "select") {
                campo = document.createElement("select");
                carregarOpcoes(campo, c);
            } else {
                campo = document.createElement("input");
                campo.type = c.tipo === "numero" ? "number" : "text";
                if (c.tipo === "numero") {
                    campo.step = "any";
                }
                campo.placeholder = c.ph || "";
            }
            campo.id = "campo-" + c.k;
            rotulo.appendChild(campo);
            area.appendChild(rotulo);
        });
        document.getElementById("dica").textContent = atual.dica || "";
    }

    // preenche o select com os registros da API: mostra o nome, o value é o ID
    async function carregarOpcoes(select, c) {
        const vazio = document.createElement("option");
        vazio.value = "";
        vazio.textContent = c.opcional ? "(nenhum)" : "Selecione...";
        select.appendChild(vazio);

        const resp = await chamar("GET", c.ref);
        if (resp === null || !resp.ok) {
            vazio.textContent = "Não foi possível carregar as opções";
            return;
        }
        const registros = await resp.json();
        registros.forEach(function (r) {
            const opcao = document.createElement("option");
            opcao.value = r[c.valor];
            opcao.textContent = r[c.texto];
            select.appendChild(opcao);
        });
        if (select.dataset.pendente) {
            select.value = select.dataset.pendente;
        }
    }

    function formatar(valor) {
        if (valor === null || valor === undefined) {
            return "";
        }
        const texto = String(valor);
        // só datas ISO (2026-11-11T21:16:03.123) são reformatadas; outros textos ficam intactos
        if (/^\d{4}-\d{2}-\d{2}T/.test(texto)) {
            return texto.replace("T", " ").split(".")[0];
        }
        return texto;
    }

    async function listar() {
        const rota = atual.rota;
        const resp = await chamar("GET", rota);
        if (resp === null) {
            return;
        }
        if (!resp.ok) {
            mostrar("GET " + rota + " → " + resp.status + ": " + await textoErro(resp), false);
            return;
        }

        const registros = await resp.json();

        // busca os nomes das referências usadas nas colunas: { idRua: { 1: "Av. Goiás" }, ... }
        const nomes = {};
        const chaves = atual.colunas.map(function (col) { return col[1]; })
            .filter(function (k) { return REFERENCIAS[k] && k !== atual.chave; });
        await Promise.all(chaves.map(async function (k) {
            nomes[k] = {};
            const r = await chamar("GET", REFERENCIAS[k].rota);
            if (r !== null && r.ok) {
                (await r.json()).forEach(function (item) { nomes[k][item[k]] = item[REFERENCIAS[k].nome]; });
            }
        }));

        if (rota !== atual.rota) {
            return;
        }
        const corpo = document.getElementById("corpo");
        corpo.innerHTML = "";

        registros.forEach(function (r) {
            const linha = document.createElement("tr");

            atual.colunas.forEach(function (col) {
                const celula = document.createElement("td");
                const valor = r[col[1]];
                const mapa = nomes[col[1]];
                celula.textContent = (mapa && mapa[valor] !== undefined) ? mapa[valor] : formatar(valor);
                linha.appendChild(celula);
            });

            const acoes = document.createElement("td");

            const btnEditar = document.createElement("button");
            btnEditar.textContent = "Editar";
            btnEditar.className = "editar";
            btnEditar.onclick = function () { editar(r); };

            const btnExcluir = document.createElement("button");
            btnExcluir.textContent = "Excluir";
            btnExcluir.className = "excluir";
            btnExcluir.onclick = function () { excluir(r[atual.chave]); };

            acoes.appendChild(btnEditar);
            acoes.appendChild(document.createTextNode(" "));
            acoes.appendChild(btnExcluir);
            linha.appendChild(acoes);

            corpo.appendChild(linha);
        });
    }

    function editar(r) {
        idEditando = r[atual.chave];
        atual.campos.forEach(function (c) {
            const valor = r[c.k];
            const campo = document.getElementById("campo-" + c.k);
            const texto = (valor === null || valor === undefined) ? "" : String(valor);
            campo.value = texto;
            if (c.tipo === "select") {
                campo.dataset.pendente = texto; // aplicado quando as opções terminarem de carregar
            }
        });
        document.getElementById("titulo-form").textContent = "Editando " + atual.singular + " " + idEditando;
        document.getElementById("btn-salvar").textContent = "Salvar alteração";
        document.getElementById("btn-cancelar").style.display = "inline-block";
        window.scrollTo(0, 0);
    }

    function limpar() {
        idEditando = null;
        document.getElementById("form").reset();
        document.querySelectorAll("#campos select").forEach(function (sel) { delete sel.dataset.pendente; });
        document.getElementById("titulo-form").textContent = "Novo(a) " + atual.singular;
        document.getElementById("btn-salvar").textContent = "Cadastrar";
        document.getElementById("btn-cancelar").style.display = "none";
    }

    async function excluir(id) {
        if (!confirm("Excluir " + atual.singular + " " + id + "?")) {
            return;
        }
        const url = atual.rota + "/" + id;
        const resp = await chamar("DELETE", url);
        if (resp === null) {
            return;
        }
        if (resp.status === 204) {
            mostrar("DELETE " + url + " → 204 Excluído com sucesso", true);
            listar();
        } else {
            mostrar("DELETE " + url + " → " + resp.status + ": " + await textoErro(resp), false);
        }
    }

    document.getElementById("form").addEventListener("submit", async function (e) {
        e.preventDefault();

        // campo vazio vai como null (a API usa o padrão ou devolve a mensagem de campo obrigatório)
        const dados = {};
        atual.campos.forEach(function (c) {
            const texto = document.getElementById("campo-" + c.k).value;
            if (texto === "") {
                dados[c.k] = null;
            } else {
                dados[c.k] = (c.tipo === "numero" || c.tipo === "select") ? Number(texto) : texto;
            }
        });

        const metodo = idEditando ? "PUT" : "POST";
        const url = idEditando ? atual.rota + "/" + idEditando : atual.rota;

        const resp = await chamar(metodo, url, dados);
        if (resp === null) {
            return;
        }
        if (resp.ok) {
            let texto = metodo + " " + url + " → " + resp.status + " OK";
            if (metodo === "POST" && atual.rota === "/leituras") {
                texto += " (se o nível passou do limite da rua, um alerta foi gerado: veja a aba Alertas)";
            }
            mostrar(texto, true);
            limpar();
            listar();
        } else {
            mostrar(metodo + " " + url + " → " + resp.status + ": " + await textoErro(resp), false);
        }
    });

    document.getElementById("btn-cancelar").addEventListener("click", limpar);

    trocarAba(ENTIDADES[0]);
</script>

</body>
</html>
